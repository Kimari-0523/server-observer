services:
  observer:
    build:
      context: ..
      dockerfile: self-hosted/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    ports: ["127.0.0.1:8788:8788"]
    volumes: ["observer-data:/data"]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 384m
    pids_limit: 96
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "3"}
  caddy:
    image: caddy:2-alpine
    profiles: [tls]
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Run the setup wizard first}
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", "caddy-data:/data", "caddy-config:/config"]
    depends_on: [observer]
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "3"}
volumes:
  observer-data:
  caddy-data:
  caddy-config:
